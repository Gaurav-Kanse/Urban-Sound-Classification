[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundsense"
version = "1.0.0"
description = "Reproducible urban environmental sound classification with UrbanSound8K"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "librosa>=0.10.2,<0.12",
  "soundfile>=0.12,<1", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1", "torch>=2.2,<3", "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1", "python-multipart>=0.0.9,<1",
  "streamlit>=1.32,<2", "plotly>=5.20,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.4,<1", "black>=24,<27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]
